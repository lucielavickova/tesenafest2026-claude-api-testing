name: PR checks

# pull_request (never pull_request_target): code from a PR never runs with write access or
# secrets from another context. PRs from forks are out of scope and get no secrets.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # flaky test comment

# One group per PR, so PRs do not cancel each other. A shared group would keep only one
# pending run and cancel the rest. A running run is not cancelled: a cancelled run can skip
# its cleanup and leave test projects for up to 1 hour (until the setup project deletes them).
# A new push replaces only the pending run of the same PR.
# Runs of different PRs may overlap on the shared Todoist account. The data is isolated by
# run id and CI uses 1 worker per run, but the free plan project limit is not guaranteed
# when many PRs run at the same time.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  checks:
    name: Lint, type check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      # Unit tests of the framework, without the API token, for quick feedback. They include an
      # end-to-end check of the token redaction with a fake token.
      - name: Run unit tests
        run: npm run test:unit

      # All tests again (the unit tests take seconds), so the report and the flaky report cover
      # both. Runs even when the unit tests failed. API tests only, so no browsers are installed.
      - name: Run tests
        if: ${{ !cancelled() }}
        run: npm test
        env:
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}

      # The repo is public: nothing is uploaded unless this check passes.
      - name: Check artifacts for the API token
        id: leak-check
        if: ${{ !cancelled() }}
        run: node scripts/check-no-token.mts
        env:
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}

      - name: Report flaky tests
        if: ${{ !cancelled() && steps.leak-check.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          count=$(node scripts/report-flaky.mts test-results/results.json flaky-report.md)
          comment_id=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- flaky-tests-report -->"))) | .id' \
            | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$comment_id" -F body=@flaky-report.md > /dev/null
          elif [ "$count" -gt 0 ]; then
            gh pr comment "$PR_NUMBER" --body-file flaky-report.md
          fi

      - name: Upload HTML report
        if: ${{ !cancelled() && steps.leak-check.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces of failed tests
        if: ${{ failure() && steps.leak-check.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: test-results/
          retention-days: 14
