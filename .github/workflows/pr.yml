name: PR checks

# pull_request (never pull_request_target): code from a PR never runs with write access or
# secrets from another context. PRs from forks are out of scope and get no secrets.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # flaky test comment

# All runs share one Todoist account, so PR and smoke runs never overlap.
concurrency:
  group: todoist-account
  cancel-in-progress: false

jobs:
  checks:
    name: Lint, type check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      # API tests only, so no browsers are installed.
      - name: Run tests
        run: npx playwright test --pass-with-no-tests
        env:
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}

      # The repo is public: nothing is uploaded unless this check passes.
      - name: Check artifacts for the API token
        id: leak-check
        if: ${{ !cancelled() }}
        run: node scripts/check-no-token.mts
        env:
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}

      - name: Report flaky tests
        if: ${{ !cancelled() && steps.leak-check.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          count=$(node scripts/report-flaky.mts test-results/results.json flaky-report.md)
          comment_id=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- flaky-tests-report -->"))) | .id' \
            | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$comment_id" -F body=@flaky-report.md > /dev/null
          elif [ "$count" -gt 0 ]; then
            gh pr comment "$PR_NUMBER" --body-file flaky-report.md
          fi

      - name: Upload HTML report
        if: ${{ !cancelled() && steps.leak-check.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces of failed tests
        if: ${{ failure() && steps.leak-check.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 14
