name: Hourly smoke

on:
  schedule:
    - cron: '0 * * * *' # every hour, on the default branch (main)
  workflow_dispatch:

permissions:
  contents: read
  issues: write # smoke-failure issue

# All runs share one Todoist account, so PR and smoke runs never overlap.
concurrency:
  group: todoist-account
  cancel-in-progress: false

jobs:
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run smoke tests
        run: npx playwright test --grep @smoke --pass-with-no-tests
        env:
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}

      # The repo is public: nothing is uploaded unless this check passes.
      - name: Check artifacts for the API token
        id: leak-check
        if: ${{ !cancelled() }}
        run: node scripts/check-no-token.mts
        env:
          TODOIST_API_TOKEN: ${{ secrets.TODOIST_API_TOKEN }}

      - name: Upload HTML report
        if: ${{ !cancelled() && steps.leak-check.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces of failed tests
        if: ${{ failure() && steps.leak-check.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      - name: Open or update the smoke-failure issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create smoke-failure --color B60205 \
            --description "The hourly smoke run failed" --force > /dev/null
          number=$(gh issue list --label smoke-failure --state open --limit 1 \
            --json number --jq '.[0].number // empty')
          body="The smoke run on \`${GITHUB_REF_NAME}\` failed: $RUN_URL"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "Hourly smoke tests failed" --label smoke-failure \
              --body "$body

          Close this issue when the smoke tests pass again. Later failures are added as comments."
          fi
